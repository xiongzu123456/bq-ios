name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee gen.log

      - name: List project
        run: ls -la && find . -name '*.xcodeproj' -o -name '*.xcworkspace'

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild build \
            -scheme BQIos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build.log

      - name: Dump Products tree
        run: find build/dd/Build/Products -type f | sort | head -50 | tee products.txt

      - name: Pack into IPA
        run: |
          set -e
          APP_PATH=$(find build/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "App path: $APP_PATH"
          ls -laR "$APP_PATH" || true
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r BQIos.ipa Payload

      - name: Commit logs and IPA back
        run: |
          set -e
          git config user.email "ci@bq.local"
          git config user.name "bq-ci"
          cp build/BQIos.ipa ./BQIos.ipa 2>/dev/null || true
          cp gen.log build.log products.txt ./ 2>/dev/null || true
          git add -A
          git commit -m "ci: dump logs + ipa" || echo "nothing"
          git push
