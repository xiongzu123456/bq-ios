name: BQIos
options:
  bundleIdPrefix: com.bq
  deploymentTarget:
    iOS: "12.0"
targets:
  BQIos:
    type: application
    platform: iOS
    sources:
      - BQIos/Sources
    info:
      path: BQIos/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bq.messenger
        PRODUCT_NAME: BQIos
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
